# @aegis-gen
# date: 2026-06-27
# dev: Claude Code (glm-5.2)
# change: 新建 pyproject.toml，定义 Python 项目依赖与工具链配置

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisos"
version = "0.1.0"
description = "AegisOS — Agent Operating System + AI Native IDE"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
]
storage = [
    "neo4j>=5",
    "qdrant-client>=1.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# P3.3: CI 排除非 Python 文件 & 第三方配置目录
# - .github/docs/frontend: 非 Python 项目代码
# - .claude: Claude Code 配置 + skills（仓库内但属工具链，非业务）
# - .venv/.git/agents/api: 历史 R1 重命名前路径（agents 是旧名，api 是 agents 子包历史名）
extend-exclude = [
    ".github",
    "docs",
    "frontend",
    ".claude",
    ".venv",
    "agents",
    "api",
    "**/*.md",
    "**/*.yml",
    "**/*.yaml",
    "**/*.toml",
    "Makefile",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["protocol", "aegisos_agents", "backend", "frontend", "infrastructure", "observability", "data", "tooling"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["protocol*", "aegisos_agents*", "backend*", "frontend*", "infrastructure*", "observability*", "data*", "tooling*"]
