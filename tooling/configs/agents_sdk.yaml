# =============================================================================
# OpenAI Agents SDK (openai-agents) 开发配置
# =============================================================================
# 用途:
#   - 集成 openai-agents SDK 替换手写 Agent 框架（见 docs/RESEARCH_AGENT_FRAMEWORK_REFACTOR.md）
#   - 本文件是 SDK 相关配置的 SSOT，由 tooling/configs/settings.py 加载
#   - API Key 等敏感信息走环境变量（.env），不硬编码于此
#
# ⚠️ 待办（开发者填写）:
#   1. 在 tooling/configs/.env 中补充下方 "环境变量" 段的 Key
#   2. 确认 model 配置（默认 gpt-5.4-mini，可改 gpt-5.5 / gpt-4o-mini 等）
#   3. 确认 provider 策略（openai / litellm / custom）
# =============================================================================

# --- SDK 版本约束 ---
sdk:
  name: openai-agents
  version: ">=0.17"
  # 包名冲突说明：SDK 包名 `agents` 与项目目录 `agents/` 同名
  # 解决方案：项目目录重命名为 aegisos_agents/（待执行，见迁移计划）

# --- 模型配置 ---
model:
  # 默认模型（SDK 默认 gpt-5.4-mini，可按需调整）
  # 选项: gpt-5.5 / gpt-5.4-mini / gpt-5-mini / gpt-4o-mini / gpt-4.1 等
  default: "gpt-5.4-mini"

  # 模型设置（对应 SDK ModelSettings）
  settings:
    temperature: 0.3          # 攻防场景偏低温度保证稳定
    max_tokens: 4096
    # reasoning_effort: none   # GPT-5 系列可选: none / low / medium / high
    # verbosity: low           # GPT-5 系列可选: low / medium / high

  # 端边云 tier → 模型映射（项目特有调度，保留）
  # 对应 agents/planning/engine/scheduler/ 的端边云三层
  tier_map:
    device: "gpt-5-mini"       # 端侧：小模型低延迟
    edge: "gpt-5.4-mini"       # 边侧：中等模型
    cloud: "gpt-5.5"           # 云侧：大模型高能力

# --- Provider 策略 ---
provider:
  # 策略: openai（默认，用 OpenAI Responses API） / litellm（多模型兼容） / custom（自建）
  strategy: openai

  # OpenAI 直连
  openai:
    # API Key 走环境变量 OPENAI_API_KEY（见下方环境变量段）
    api: responses             # responses（默认，推荐） / chat_completions
    base_url: ""               # 留空用默认；自建代理时填 https://your-proxy/v1
    tracing: true              # 是否上传 trace 到 OpenAI（无 Key 时设 false）

  # LiteLLM 多模型兼容（替代手写 4 个 Provider）
  # 启用条件: provider.strategy = litellm
  litellm:
    enabled: false
    # 支持 100+ provider: anthropic/claude-* / ollama/* / vllm/* / azure/* 等
    # 前缀路由由 SDK MultiProvider 自动处理
    models:
      - id: "gpt-5.4-mini"
        tier: cloud
      - id: "ollama/qwen2.5:7b"
        tier: edge
      - id: "ollama/qwen2.5:1.5b"
        tier: device

  # 自建 OpenAI 兼容端点（如荣耀内部模型网关）
  custom:
    enabled: false
    base_url: ""
    api_key_env: CUSTOM_LLM_API_KEY   # 环境变量名

# --- 编排策略（Handoffs vs Agents-as-tools）---
orchestration:
  # 红队攻击链: recon → vuln_correlator → exploit_planner → lateral_move
  red_chain:
    pattern: handoff           # handoff（去中心化）/ manager（中心化）
    agents:
      - recon
      - vuln_correlator
      - exploit_planner
      - lateral_move
    # 神经符号闭环：critic 校验失败 → 回 exploit_planner 重新规划
    loop:
      critic_agent: critic
      retry_target: exploit_planner
      max_iterations: 3

  # 蓝队防御链: detector → triage → threat_hunt → ir_planner → forensics
  blue_chain:
    pattern: handoff
    agents:
      - detector
      - triage
      - threat_hunt
      - ir_planner
      - forensics

  # 紫队：critic + reviewer 作为独立 Agent 被两链调用
  purple:
    critic_agent: critic
    reviewer_agent: reviewer

# --- 结构化输出（替代 json.loads + try/except）---
output_types:
  # 每个 Agent 的输出类型（Pydantic BaseModel，待 protocol/ 迁移 Pydantic 后启用）
  # 迁移前: protocol.cyber 的 dataclass 可被 SDK AgentOutputSchema 包装
  recon: list[Asset]
  vuln_correlator: list[VulnFinding]
  exploit_planner: AttackChain
  lateral_move: list[AttackStep]
  detector: list[Alert]
  triage: list[Alert]
  threat_hunt: list[HuntHypothesis]
  ir_planner: ResponsePlan
  forensics: ForensicReport
  critic: CritiqueResult
  reviewer: ReviewResult

# --- 记忆 / Session ---
memory:
  # SDK Session 策略: none / sqlite / sqlalchemy / redis / custom
  strategy: sqlite
  # 项目 MemoryStore（B3 已实现）与 SDK Session 并行：
  #   - MemoryStore: 领域记忆（working/episodic/semantic/vector + 压缩/唤醒）
  #   - SDK Session: 对话级上下文持久化（Runner 内部状态）
  # 两者职责不同，保留 MemoryStore，SDK Session 作为 Runner 运行时上下文

# --- 流式 ---
streaming:
  enabled: true
  # Runner.run_streamed() → SSE → 前端 EventSource
  # 替代当前 backend 的手写 SSE events.py

# --- Tracing ---
tracing:
  enabled: true
  # SDK 内置追踪，替代项目 EventBusAPI（当前无实现）
  # 可导出到 OpenAI 平台可视化，或用自定义 TracingProcessor

# =============================================================================
# 环境变量（请在 tooling/configs/.env 中补充）
# =============================================================================
# # --- OpenAI Agents SDK ---
# OPENAI_API_KEY=sk-...                              # 必填：OpenAI API Key
# OPENAI_DEFAULT_MODEL=gpt-5.4-mini                  # 可选：覆盖默认模型
# OPENAI_BASE_URL=https://api.openai.com/v1          # 可选：自建代理时改
#
# # --- LiteLLM（若 provider.strategy = litellm）---
# ANTHROPIC_API_KEY=sk-ant-...                       # Claude 系列
# OLLAMA_API_BASE=http://localhost:11434             # 本地 Ollama
#
# # --- 自建端点（若 provider.strategy = custom）---
# CUSTOM_LLM_API_KEY=...
#
# # --- Tracing（无 OpenAI Key 时禁用）---
# OPENAI_AGENTS_DISABLE_TRACING=true                 # 可选：禁用 trace 上传
# =============================================================================
