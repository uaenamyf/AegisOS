gateway:
  auth:
    enabled: true
    mode: "api-key"
    api_key_header: "X-API-Key"
    default_key: "aegis-dev-key"
  rate_limit:
    enabled: true
    requests_per_minute: 120
  trace:
    enabled: true
    header: "X-Trace-Id"
